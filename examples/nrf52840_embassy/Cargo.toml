[package]
edition = "2024"
name = "nrf52833-examples"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = true

[dependencies]
cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
embassy-executor = { version = "0.9.0", features = ["arch-cortex-m", "defmt", "executor-thread", "executor-interrupt"] }
embassy-hal-internal = "0.3.0"
embassy-nrf = { version = "0.8.0", features = ["defmt", "gpiote", "time", "time-driver-rtc1", "unstable-pac", "nrf52833"] }
embassy-sync = "0.7.2"
embassy-time = { version = "0.5.0", features = ["defmt", "defmt-timestamp-uptime"] }
fixed = "1.29"
hdc302x = { path = "../..", features = ["defmt"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
heapless = "0.9.1"
anyhow = { version = "1.0.100", default-features = false }
